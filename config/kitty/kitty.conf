font_family MonoLisa
bold_font auto
italic_font auto
bold_italic_font auto

font_size 14.0

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

window_padding_width 2
scrollback_lines 10000
tab_bar_edge top
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style round
tab_title_template " {fmt.fg._e46a78}{activity_symbol}{fmt.fg.tab}{bell_symbol}{"󰲠󰲢󰲤󰲦󰲨󰲪󰲬󰲮󰲰"[index-1] if index < 10 else index} {title} "
# Two cells so the numbered circles are big enough to read.
narrow_symbols U+F0CA0-U+F0CB1 2
tab_activity_symbol "● "
active_tab_font_style bold

# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME

# Overrides the theme: visible inactive tabs, red active tab.
inactive_tab_background #49495e
inactive_tab_foreground #ddd8bb
active_tab_background #e46a78
active_tab_foreground #1f1f28
